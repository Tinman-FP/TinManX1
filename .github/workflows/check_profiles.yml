name: Check profiles
on:
  pull_request:
    branches:
    - main
    paths:
    - 'resources/profiles/**'
    - 'scripts/lint_tinmanx1_fiberseek_profiles.py'
    - 'scripts/orca_extra_profile_check.py'
    - ".github/workflows/check_profiles.yml"

  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

permissions:
  contents: read


jobs:
  check_profiles:
    name: Check profiles
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run extra JSON check
        id: extra_json_check
        continue-on-error: true
        run: |
          set +e
          status=0
          python3 ./scripts/orca_extra_profile_check.py 2>&1 | tee ${{ runner.temp }}/extra_json_check.log
          status=${PIPESTATUS[0]}
          python3 ./scripts/lint_tinmanx1_fiberseek_profiles.py 2>&1 | tee -a ${{ runner.temp }}/extra_json_check.log
          lint_status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi
          exit "${lint_status}"

      # download
      - name: Download
        working-directory: ${{ github.workspace }}
        run: |
          curl -L -o OrcaSlicer_profile_validator https://github.com/OrcaSlicer/OrcaSlicer/releases/download/nightly-builds/OrcaSlicer_profile_validator_Linux_Ubuntu2404_nightly
          chmod +x ./OrcaSlicer_profile_validator

      - name: Prepare validator profile trees
        run: |
          validation_profiles="${{ runner.temp }}/upstream-validator-profiles"
          custom_validation_profiles="${{ runner.temp }}/custom-validator-profiles"
          rm -rf "${validation_profiles}" "${custom_validation_profiles}"
          mkdir -p "${validation_profiles}" "${custom_validation_profiles}"
          cp -a "${{ github.workspace }}/resources/profiles/." "${validation_profiles}/"
          cp -a "${{ github.workspace }}/resources/profiles/." "${custom_validation_profiles}/"
          VALIDATION_PROFILES="${validation_profiles}" CUSTOM_VALIDATION_PROFILES="${custom_validation_profiles}" python3 <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          system_root = Path(os.environ["VALIDATION_PROFILES"])
          custom_root = Path(os.environ["CUSTOM_VALIDATION_PROFILES"])

          for root, vendors in (
              (system_root, ("Codex", "Qidi", "Snapmaker", "TinManX1")),
              (custom_root, ("Codex", "TinManX1")),
          ):
              for vendor in vendors:
                  vendor_dir = root / vendor
                  vendor_json = root / f"{vendor}.json"
                  if vendor_dir.exists():
                      shutil.rmtree(vendor_dir)
                  if vendor_json.exists():
                      vendor_json.unlink()

          # The custom preset fixture archive contains historical user presets that inherit
          # from local Qidi/Snapmaker parents. Keep those parents in the fixture tree, but make
          # sure locally added Qidi machine preset files are indexed and compatible with the
          # upstream nightly validator used by CI.
          qidi_json = custom_root / "Qidi.json"
          if qidi_json.exists():
              data = json.loads(qidi_json.read_text(encoding="utf-8"))
              machine_list = data.setdefault("machine_list", [])
              existing = {
                  entry.get("name")
                  for entry in machine_list
                  if isinstance(entry, dict)
              }
              qidi_machine_dir = custom_root / "Qidi" / "machine"
              if qidi_machine_dir.exists():
                  for path in sorted(qidi_machine_dir.glob("QidiMaxEz *.json")):
                      profile = json.loads(path.read_text(encoding="utf-8"))
                      name = profile.get("name")
                      if profile.get("type") == "machine" and name and name not in existing:
                          machine_list.append({
                              "name": name,
                              "sub_path": f"machine/{path.name}",
                          })
                          existing.add(name)
              qidi_json.write_text(
                  json.dumps(data, indent="\t", ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          obsolete_qidi_keys = {
              "filament_dev_ams_drying_ams_limitations",
              "filament_dev_ams_drying_heat_distortion_temperature",
              "filament_dev_ams_drying_temperature",
              "filament_dev_ams_drying_time",
              "filament_dev_chamber_drying_bed_temperature",
              "filament_dev_chamber_drying_time",
              "filament_dev_drying_cooling_temperature",
              "filament_dev_drying_softening_temperature",
              "machine_prepare_compensation_time",
          }
          qidi_dir = custom_root / "Qidi"
          if qidi_dir.exists():
              for path in qidi_dir.rglob("*.json"):
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if not isinstance(data, dict):
                      continue
                  if obsolete_qidi_keys.isdisjoint(data):
                      continue
                  for key in obsolete_qidi_keys:
                      data.pop(key, None)
                  path.write_text(
                      json.dumps(data, indent="\t", ensure_ascii=False) + "\n",
                      encoding="utf-8",
                  )
          PY
          echo "VALIDATION_PROFILES=${validation_profiles}" >> "$GITHUB_ENV"
          echo "CUSTOM_VALIDATION_PROFILES=${custom_validation_profiles}" >> "$GITHUB_ENV"

      # Validate all system profiles.
      - name: validate system profiles
        id: validate_system
        continue-on-error: true
        run: |
          set +e
          ./OrcaSlicer_profile_validator -p "${VALIDATION_PROFILES}" -l 2 2>&1 | tee ${{ runner.temp }}/validate_system.log
          exit ${PIPESTATUS[0]}
      # For now run filament subtype check only for BBL profiles until we fix other vendors' profiles.
      - name: validate filament subtype check for BBL profiles
        id: validate_filament_subtypes
        continue-on-error: true
        run: |
          set +e
          ./OrcaSlicer_profile_validator -p "${VALIDATION_PROFILES}" -l 2 -v BBL -f 2>&1 | tee ${{ runner.temp }}/validate_filament_subtypes.log
          exit ${PIPESTATUS[0]}

      - name: validate custom presets
        id: validate_custom
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        run: |
          fixtures_dir="${{ runner.temp }}/profile-fixtures"
          output_dir="${{ runner.temp }}/custom-preset-validation"
          combined_log="${{ runner.temp }}/validate_custom.log"
          summary="${output_dir}/summary.md"
          release_url="https://github.com/OrcaSlicer/OrcaSlicer-profile-validator/releases/download/fixture-archive"

          rm -rf "${fixtures_dir}" "${output_dir}"
          mkdir -p "${fixtures_dir}" "${output_dir}"

          curl -fsSL -o "${fixtures_dir}/manifest.json" "${release_url}/manifest.json"

          MANIFEST_PATH="${fixtures_dir}/manifest.json" python3 <<'PY' > "${fixtures_dir}/fixtures.tsv"
          import json
          import os

          with open(os.environ["MANIFEST_PATH"], encoding="utf-8") as fh:
              manifest = json.load(fh)

          if isinstance(manifest, dict):
              entries = manifest.get("fixtures", [])
          else:
              entries = manifest

          for entry in entries:
              version = entry.get("version", "")
              asset = entry.get("asset", "")
              sha256 = entry.get("asset_sha256", "")
              if not version or not asset:
                  continue
              print(f"{version}\t{asset}\t{sha256}")
          PY

          if [ ! -s "${fixtures_dir}/fixtures.tsv" ]; then
            echo "No custom preset fixtures found in ${release_url}/manifest.json" | tee "${combined_log}"
            exit 1
          fi

          {
            echo "## Custom Preset Fixture Validation"
            echo ""
            echo "| Version | Status | Log |"
            echo "| --- | --- | --- |"
          } > "${summary}"

          status=0
          failed_logs=()
          normalizer="${output_dir}/normalize_compatible_printers.py"

          cat > "${normalizer}" <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["PROFILE_TREE"])
          valid_machines = set()

          for index in root.glob("*.json"):
              try:
                  data = json.loads(index.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if not isinstance(data, dict):
                  continue
              for entry in data.get("machine_list", []):
                  if isinstance(entry, dict) and entry.get("name"):
                      valid_machines.add(entry["name"])

          for path in root.rglob("*.json"):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if isinstance(data, dict) and data.get("type") == "machine" and data.get("name"):
                  valid_machines.add(data["name"])

          changed = 0
          for path in root.rglob("*.json"):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if not isinstance(data, dict):
                  continue
              printers = data.get("compatible_printers")
              if not isinstance(printers, list):
                  continue
              filtered = [printer for printer in printers if printer in valid_machines]
              if filtered == printers:
                  continue
              if filtered:
                  data["compatible_printers"] = filtered
              else:
                  data.pop("compatible_printers", None)
              path.write_text(
                  json.dumps(data, indent="\t", ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )
              changed += 1

          print(f"Normalized stale compatible_printers references in {changed} profile files")
          PY

          while IFS=$'\t' read -r version asset expected_sha256; do
            fixture_zip="${fixtures_dir}/${asset}"
            asset_url_name="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${asset}")"
            profile_tree="${output_dir}/profiles-${version}"
            log_path="${output_dir}/${version}.log"

            curl -fsSL -o "${fixture_zip}" "${release_url}/${asset_url_name}"

            if [ -n "${expected_sha256}" ] && [ "${expected_sha256}" != "<sha256>" ]; then
              echo "${expected_sha256}  ${fixture_zip}" | sha256sum -c -
            fi

            rm -rf "${profile_tree}"
            mkdir -p "${profile_tree}"
            cp -a "${CUSTOM_VALIDATION_PROFILES}/." "${profile_tree}/"
            rm -rf "${profile_tree}/user"
            unzip -q "${fixture_zip}" -d "${profile_tree}"

            PROFILE_TREE="${profile_tree}" python3 "${normalizer}"

            set +e
            ./OrcaSlicer_profile_validator -p "${profile_tree}" -l 2 > "${log_path}" 2>&1
            result=$?
            set -e

            if [ "${result}" -eq 0 ]; then
              echo "| ${version} | PASS | ${version}.log |" >> "${summary}"
            else
              echo "| ${version} | FAIL | ${version}.log |" >> "${summary}"
              failed_logs+=("${log_path}")
              status=1
            fi
          done < "${fixtures_dir}/fixtures.tsv"

          {
            cat "${summary}"
            if [ "${#failed_logs[@]}" -gt 0 ]; then
              echo ""
              echo "## Failed Fixture Logs"
              for log_path in "${failed_logs[@]}"; do
                echo ""
                echo "### $(basename "${log_path}" .log)"
                echo '```'
                head -c 12000 "${log_path}" || echo "No output captured"
                echo '```'
              done
            fi
          } | tee "${combined_log}"

          exit "${status}"

      - name: Prepare PR number for comment workflow
        if: ${{ always() && github.event_name == 'pull_request' }}
        run: |
          mkdir -p ${{ runner.temp }}/profile-check-results
          echo "${{ github.event.pull_request.number }}" > ${{ runner.temp }}/profile-check-results/pr_number.txt

      - name: Prepare comment artifact
        if: ${{ always() && github.event_name == 'pull_request' && (steps.extra_json_check.outcome == 'failure' || steps.validate_system.outcome == 'failure' || steps.validate_filament_subtypes.outcome == 'failure' || steps.validate_custom.outcome == 'failure') }}
        run: |
          {
            # Marker matched by check_profiles_comment.yml to delete prior comments.
            echo "<!-- profile-validation-comment -->"
            echo "## :x: Profile Validation Errors"
            echo ""

            if [ "${{ steps.extra_json_check.outcome }}" = "failure" ]; then
              echo "### Extra JSON Check Failed"
              echo ""
              echo '```'
              head -c 30000 ${{ runner.temp }}/extra_json_check.log || echo "No output captured"
              echo '```'
              echo ""
            fi

            if [ "${{ steps.validate_system.outcome }}" = "failure" ]; then
              echo "### System Profile Validation Failed"
              echo ""
              echo '```'
              head -c 30000 ${{ runner.temp }}/validate_system.log || echo "No output captured"
              echo '```'
              echo ""
            fi

            if [ "${{ steps.validate_filament_subtypes.outcome }}" = "failure" ]; then
              echo "### BBL Filament Subtype Validation Failed"
              echo ""
              echo '```'
              head -c 30000 ${{ runner.temp }}/validate_filament_subtypes.log || echo "No output captured"
              echo '```'
              echo ""
            fi

            if [ "${{ steps.validate_custom.outcome }}" = "failure" ]; then
              echo "### Custom Preset Validation Failed"
              echo ""
              echo '```'
              head -c 30000 ${{ runner.temp }}/validate_custom.log || echo "No output captured"
              echo '```'
              echo ""
            fi

            echo "---"
            echo "*Please fix the above errors and push a new commit.*"
          } > ${{ runner.temp }}/profile-check-results/pr_comment.md

      - name: Upload comment artifact
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: profile-check-results
          path: ${{ runner.temp }}/profile-check-results/
          retention-days: 1

      - name: Fail if any check failed
        if: ${{ always() && (steps.extra_json_check.outcome == 'failure' || steps.validate_system.outcome == 'failure' || steps.validate_filament_subtypes.outcome == 'failure' || steps.validate_custom.outcome == 'failure') }}
        run: |
          echo "One or more profile checks failed. See above for details."
          exit 1
